# TrueNAS Custom App — llama.cpp server + embedded Web UI
#
# Install via: TrueNAS SCALE (Electric Eel) → Apps → Custom Apps →
#             "Install via YAML" → paste this content.
#
# Host: 192.168.2.1   Port: 30084 (WebUI + OpenAI-compatible API)
#
# Image is published to Docker Hub (anonymous pull), built from llama.cpp
# v1.0.0 (b12359) + the adaptive KV streaming V2 patch. The model files are
# bind-mounted read-only from the vega pool — keep them on SSD for fast load.
services:
  llama-ui:
    image: docker.io/binarybrian/llama-cpp:4060ti
    container_name: llama-ui
    pull_policy: always
    ports:
      - "30084:8080"
    volumes:
      # /mnt/vega/models on TrueNAS -> /models inside the container (read-only)
      - /mnt/vega/models:/models:ro
    environment:
      # Unsloth Dynamic V3.1 Qwen3.8-27B, UD-IQ3_XXS
      # (10.93 GB / 10.18 GiB, ~3.2 bpw, MTP head embedded:
      # nextn_predict_layers = 1, blk.64.nextn.*; 64 + 1 blocks).
      - MODEL_PATH=/models/qwen38-27b-unsloth-abl/Qwen3.8-27B-UD-IQ3_XXS-abliterated.gguf
      - MMPROJ_PATH=/models/mmproj-Qwen3.8-27B-Q8_0.gguf
      - MMPROJ_OFFLOAD=1
      - ALIAS=qwen3.8-27b
      - TRY_MTP=1
      - SPEC_DRAFT_N_MAX=2
      # Only consulted in CTX_SIZE=auto mode; inert here (the arena forces --fit off)
      - FIT_TARGET=1024
      - CTX_SIZE=131072
      # arena qualification: q8_0 K / q4_0 V. The MTP draft inherits them, so
      # CTKD/CTVD are left unset (they only apply with KV_STREAM_ARENA_MIB=0)
      - CTK=q8_0
      - CTV=q4_0
      - AGENT=1
      - CORS_ORIGINS=*
      - LOG_VERBOSITY=4
      - UBATCH_SIZE=512
      - SLEEP_IDLE_SECONDS=300
      # Adaptive KV streaming V2: shared device arena (streaming KV working
      # set + compute workspaces) in MiB. Only takes effect on images built
      # with ./build.sh --kv-stream; 0 = disabled. Requires CTX_SIZE=<number>
      # (not auto), which runs --fit off.
      - KV_STREAM_ARENA_MIB=2048
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
